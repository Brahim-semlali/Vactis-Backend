# Configuration de la base de données en mémoire H2 pour les tests unitaires et d'intégration (@DataJpaTest)
# Ce fichier est utilisé UNIQUEMENT par les tests de couche @DataJpaTest (ex: MedecinRepositoryTest)
spring.datasource.url=jdbc:h2:mem:vactis_test_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Dialecte H2 pour les tests
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Désactiver l'exécution des scripts SQL de production pendant les tests
spring.sql.init.mode=never
