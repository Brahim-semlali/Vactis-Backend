# Configuration de la base de données en mémoire H2 pour les tests unitaires et d'intégration
spring.datasource.url=jdbc:h2:mem:vactis_test_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Utilisation du dialecte H2 pour les tests (évite les incompatibilités DDL PostgreSQL/H2)
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Désactiver la réinitialisation SQL automatique lors des tests de persistance isolés
spring.sql.init.mode=never
