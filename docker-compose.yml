services:
  db:
    image: postgres:16-alpine
    container_name: vactis-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vactis_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - stagelabo-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-vactis_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: vactis-back
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8083}:8082"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - stagelabo-network
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-vactis_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:80,http://127.0.0.1,http://127.0.0.1:80,http://localhost:5173,http://127.0.0.1:5173}

networks:
  stagelabo-network:
    name: stagelabo-network
    driver: bridge

volumes:
  pgdata:
